name: Prepare latest iOS SDK update

on:
  workflow_dispatch:

concurrency:
  group: ios-sdk-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-ios-sdk:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout React Native
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Match CircleCI; older npm versions reject this lockfile in npm ci.
          node-version: 24.14.1

      - name: Resolve latest stable iOS release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_JSON=$(gh api repos/radarlabs/radar-sdk-ios/releases/latest)
          TARGET_IOS=$(jq -r '.tag_name' <<< "$RELEASE_JSON")
          RELEASE_URL=$(jq -r '.html_url' <<< "$RELEASE_JSON")
          PLAN=$(node scripts/ios-sdk-sync.mjs plan "$TARGET_IOS" "$GITHUB_WORKSPACE")
          SYNC_ROOT="$RUNNER_TEMP/radar-ios-sdk-sync"
          mkdir -p "$SYNC_ROOT"
          echo "SYNC_ROOT=$SYNC_ROOT" >> "$GITHUB_ENV"
          {
            echo "status=$(jq -r '.status' <<< "$PLAN")"
            echo "old_ios=$(jq -r '.currentIosVersion' <<< "$PLAN")"
            echo "target_ios=$TARGET_IOS"
            echo "rn_version=$(jq -r '.targetRnVersion // empty' <<< "$PLAN")"
            echo "release_url=$RELEASE_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Stop when the latest release is already vendored
        if: steps.release.outputs.status != 'update'
        run: echo "The latest stable iOS release is not newer than the vendored version."

      - name: Checkout native SDK sources
        if: steps.release.outputs.status == 'update'
        id: native
        env:
          TARGET_IOS: ${{ steps.release.outputs.target_ios }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/radarlabs/radar-sdk-ios.git "$SYNC_ROOT/upstream-ios"
          git -C "$SYNC_ROOT/upstream-ios" checkout --detach "$TARGET_IOS"
          ANDROID_VERSION=$(node scripts/ios-sdk-sync.mjs android-version "$GITHUB_WORKSPACE")
          git clone --depth 1 --branch "$ANDROID_VERSION" https://github.com/radarlabs/radar-sdk-android.git "$SYNC_ROOT/upstream-android"
          echo "android_version=$ANDROID_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update deterministic SDK files
        if: steps.release.outputs.status == 'update'
        env:
          RN_VERSION: ${{ steps.release.outputs.rn_version }}
          TARGET_IOS: ${{ steps.release.outputs.target_ios }}
        run: |
          set -euo pipefail
          node scripts/ios-sdk-sync.mjs apply-version "$RN_VERSION" "$GITHUB_WORKSPACE"
          sudo xcode-select -switch /Applications/Xcode_26.3.app
          SDK_SOURCE_DIR="$SYNC_ROOT/upstream-ios" \
            SKIP_FRAUD=true \
            scripts/download-xcframeworks.sh "$TARGET_IOS"

      - name: Collect iOS API changes
        if: steps.release.outputs.status == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_IOS: ${{ steps.release.outputs.old_ios }}
          TARGET_IOS: ${{ steps.release.outputs.target_ios }}
        run: |
          set -euo pipefail
          CHANGES="$SYNC_ROOT/api-changes"
          mkdir -p "$CHANGES"
          gh api --paginate --slurp repos/radarlabs/radar-sdk-ios/releases \
            | jq 'add' \
            | node scripts/ios-sdk-sync.mjs release-notes "$OLD_IOS" "$TARGET_IOS" \
            > "$CHANGES/release-notes.md"
          # Diff the vendored framework's public interface, which is exactly what
          # RNRadar.mm can call. Intent-to-add makes new headers show up.
          HEADERS=ios/RadarSDK.xcframework/ios-arm64/RadarSDK.framework/Headers
          git add --intent-to-add "$HEADERS"
          git diff -- "$HEADERS" ":(exclude)$HEADERS/RadarSDK-Swift.h" > "$CHANGES/objc-headers.diff"
          git diff -- "$HEADERS/RadarSDK-Swift.h" > "$CHANGES/swift-header.diff"
          git reset --quiet -- "$HEADERS"
          wc -l "$CHANGES"/*

      - name: Install JavaScript dependencies
        if: steps.release.outputs.status == 'update'
        id: install
        continue-on-error: true
        run: npm ci

      - name: Adapt React Native APIs with Claude
        if: steps.release.outputs.status == 'update'
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action/base-action@ef8bb1e43bf303cff727a1dd0b8837029fe982a2 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Port the new public APIs in Radar iOS ${{ steps.release.outputs.target_ios }} to this
            React Native wrapper. The vendored iOS framework has already been updated from
            ${{ steps.release.outputs.old_ios }} and package versions are already bumped; your job
            is the bridge and JavaScript code.

            ## Inputs

            Start with these files in ${{ runner.temp }}/radar-ios-sdk-sync/api-changes. Read them
            before exploring anything else:
            - release-notes.md: customer-facing notes for every iOS release in this range.
            - objc-headers.diff: changes to the vendored framework's Objective-C headers.
            - swift-header.diff: changes to the generated RadarSDK-Swift.h. Most of it is internal
              Objective-C to Swift migration that keeps the same API; look only for new methods,
              properties, and enum cases.

            The full iOS source at the target tag is in
            ${{ runner.temp }}/radar-ios-sdk-sync/upstream-ios. The Android SDK pinned by this repo
            (${{ steps.native.outputs.android_version }}) is in
            ${{ runner.temp }}/radar-ios-sdk-sync/upstream-android; its public API is
            sdk/src/main/java/io/radar/sdk/Radar.kt and the models in sdk/src/main/java/io/radar/sdk/model.

            ## What to port

            - New `Radar` methods, when the pinned Android SDK has an equivalent method.
            - New fields on models React Native already returns (for example RadarUser,
              RadarEvent, RadarGeofence). The bridges pass native `dictionaryValue`/`toJson`
              output straight to JavaScript, so these usually only need TypeScript types.
            - New RadarEventType values, added to the `RadarEventType` union in src/@types/types.ts.

            Skip an API when Android has no equivalent and note it in the summary. Skip internal
            changes, bug fixes, and the Swift migration. Do not remove or rename existing APIs.

            ## How to wire a method

            Follow `setProduct` as the pattern; `git grep -n setProduct` shows every layer:
            1. ios/RNRadar.mm: RCT_EXPORT_METHOD calling the iOS SDK.
            2. src/NativeRadar.ts: the TurboModule spec.
            3. src/@types/RadarNativeInterface.ts: the public interface.
            4. src/index.native.ts: the implementation calling NativeRadar.
            5. src/index.web.js: a web fallback if the surrounding methods have one.
            6. android/src/main/java/com/radar/RadarModuleImpl.java: the call into the Android SDK.
            7. android/src/newarch/java/com/radar/RadarModule.kt and
               android/src/oldarch/java/com/radar/RadarModule.java: both arch wrappers.
            8. The jest mocks and tests in src/__tests__ and test/.

            ## Example app

            Every ported API, including type-only changes, needs a way for a reviewer to see it
            working in example/App.tsx. Add `ExampleButton`s next to related buttons and follow the
            existing handlers (`getProduct`, `setUserLanguage`, `getUserLanguage`): call the API in
            `try/catch` and show the result with `populateText("<name>: " + stringify(result))`.
            Use the handler name as the button title so the test plan can refer to it.
            - New methods: a button that calls the method. For a setter, add a matching getter
              button, or a button whose response shows the effect.
            - New fields on returned models: a button that calls an existing API returning that
              model (for example `trackOnce`) and shows only the new field, such as
              `stringify(result.user?.locationInsights)`. Showing the whole model is not enough;
              the field gets lost in the output.
            - New event types: a way to see them arrive, for example a button that registers
              `Radar.onEventsReceived` and shows each event's `type`.
            - iOS-only APIs: guard with `Platform.OS === "ios"` as src/index.native.ts does.
            Do not change or remove existing buttons.

            ## Checks

            Run `npx tsc --noEmit` and `npx jest --runInBand` after editing and fix what you broke.
            Native code cannot be compiled here; CircleCI builds it on the pull request.

            ## Rules

            Do not change package versions, vendored frameworks, lockfiles, workflow files, or
            scripts. Do not commit, push, create a pull request, or use GitHub write operations.

            ## Summary

            Finish by writing ${{ runner.temp }}/radar-ios-sdk-sync/claude-summary.md, a short
            Markdown list for the pull request body: each API you ported, each API you skipped and
            why, and anything a reviewer should check by hand. Leave manual testing out of it.

            ## Test plan

            Also write ${{ runner.temp }}/radar-ios-sdk-sync/claude-test-plan.md: numbered Markdown
            steps a reviewer follows in the Example app, grouped under a heading per ported API.
            Each step names the exact button title to tap, the platform to run it on (iOS, Android,
            or both, and what to expect on the platform without the API), any prerequisite (location
            permission, tracking started, dashboard setup such as home and work places), the text
            expected in the result area, and what a failure looks like. Base the expected output on
            the native models and dictionaryValue/toJson code you read, not on guesses.

            Start with a step to tap `nativeSdkVersion` on iOS and confirm it shows
            `${{ steps.release.outputs.target_ios }}`. If nothing was ported, that step is the whole
            plan. The pull request already includes build and setup steps; do not repeat them.
          claude_args: |
            --max-turns 150
            --add-dir ${{ runner.temp }}/radar-ios-sdk-sync
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git -C:*),Bash(git diff:*),Bash(git grep:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(rg:*),Bash(ls:*),Bash(npx tsc:*),Bash(npx jest:*)"

      - name: Validate generated changes
        if: steps.release.outputs.status == 'update'
        id: validation
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run test:ios-sdk-sync
          npm run typecheck
          npm run build-all
          npm test -- --runInBand

      - name: Summarize Claude run
        if: steps.release.outputs.status == 'update'
        id: summary
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          EXECUTION_FILE="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          {
            if [ -f "$EXECUTION_FILE" ]; then
              jq -r '
                [.[] | select(.type == "result")] | last // {} |
                "- Claude result: `\(.subtype // "unknown")` after \(.num_turns // "?") turns",
                (.permission_denials // [] | map(.tool_name + (if .tool_input.command then " `" + .tool_input.command + "`" else "" end)) | unique | .[] | "- Denied: " + .)
              ' "$EXECUTION_FILE"
            else
              echo "- Claude did not produce an execution log."
            fi
            echo
            if [ -s "$SYNC_ROOT/claude-summary.md" ]; then
              cat "$SYNC_ROOT/claude-summary.md"
            else
              echo "Claude did not write a summary; the port is probably incomplete."
            fi
          } > "$SYNC_ROOT/pr-summary.md"
          if [ -s "$SYNC_ROOT/claude-test-plan.md" ]; then
            cp "$SYNC_ROOT/claude-test-plan.md" "$SYNC_ROOT/pr-test-plan.md"
          else
            cat > "$SYNC_ROOT/pr-test-plan.md" <<'PLAN'
          Claude did not write a test plan.

          1. Tap `nativeSdkVersion` on iOS and confirm it shows the new iOS SDK version.
          2. Exercise any new Example app controls and confirm their result or event appears.
          PLAN
          fi
          DELIMITER="EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$DELIMITER"
            cat "$SYNC_ROOT/pr-summary.md"
            echo "$DELIMITER"
            echo "test_plan<<$DELIMITER"
            cat "$SYNC_ROOT/pr-test-plan.md"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update draft pull request
        if: steps.release.outputs.status == 'update'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          base: master
          branch: automation/ios-sdk-update
          delete-branch: true
          draft: always-true
          commit-message: Prepare React Native ${{ steps.release.outputs.rn_version }} for Radar iOS ${{ steps.release.outputs.target_ios }}
          title: Prepare React Native ${{ steps.release.outputs.rn_version }} for Radar iOS ${{ steps.release.outputs.target_ios }}
          body: |
            ## Summary

            - Updates the vendored Radar iOS SDK from `${{ steps.release.outputs.old_ios }}` to [`${{ steps.release.outputs.target_ios }}`](${{ steps.release.outputs.release_url }}).
            - Prepares React Native `${{ steps.release.outputs.rn_version }}` as a best-effort native API port.
            - Claude output may be incomplete; review the native diff and cross-platform parity before merging.

            ## API Port

            ${{ steps.summary.outputs.body }}

            ## Test Plan

            ### Setup

            1. Check out this branch and run `npm ci && npm run build-all`.
            2. Run `cd example && npm ci && npm run install-radar-rebuild`.
            3. Put a test publishable key in `Radar.initialize(...)` in `example/App.tsx`. Do not commit it.
            4. Run `npx expo run:ios` and `npx expo run:android`, and confirm Radar initializes without an error on both.

            ### Changes in this release

            ${{ steps.summary.outputs.test_plan }}

            ## Validation

            - npm ci: `${{ steps.install.outcome }}`
            - Claude step: `${{ steps.claude.outcome }}`
            - Node, TypeScript, and Jest validation: `${{ steps.validation.outcome }}`
            - [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - CircleCI Node, iOS, and Android jobs provide independent validation on this draft.
          labels: |
            ios-sdk-update
            needs-human
